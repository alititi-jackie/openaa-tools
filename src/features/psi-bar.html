<h1>PSI ↔ Bar 压力换算器</h1>
<p class="subtitle">轮胎、空压机和工业设备常用压力单位快速换算。</p>
<div class="tool-form">
  <div class="field">
    <label for="value">压力</label
    ><input id="value" min="0" step="0.01" type="number" value="35" />
  </div>
  <div class="field">
    <label for="direction">方向</label
    ><select id="direction">
      <option value="psi-bar">PSI → Bar</option>
      <option value="bar-psi">Bar → PSI</option>
    </select>
  </div>
  <button class="btn" id="calculate">转换</button>
</div>
<div aria-live="polite" class="result" id="result">
  <strong>2.41</strong><span>Bar</span>
</div>
<div class="info">
  <h2>换算公式</h2>
  <p>1 PSI ≈ 0.0689476 Bar；1 Bar ≈ 14.5038 PSI。</p>
</div>
