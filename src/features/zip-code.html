<h1>美国 ZIP Code 查询</h1>
<p class="subtitle">输入 ZIP Code，快速查询城市和州。</p>
<div class="tool-form">
  <div class="field">
    <label for="zip">ZIP Code</label
    ><input
      id="zip"
      inputmode="numeric"
      maxlength="5"
      placeholder="例如 90210"
    />
  </div>
  <button class="btn" id="calculate">查询 ZIP Code</button>
</div>
<div aria-live="polite" class="result" id="result">
  <strong>—</strong><span>请输入 ZIP Code</span>
</div>
<div class="note">
  数据来自 Zippopotam.us/GeoNames，仅作为地址区域参考，不代表 USPS
  官方地址验证。
</div>
<div class="info">
  <h2>ZIP Code 可以查什么？</h2>
  <p>输入美国 5 位 ZIP Code，可返回对应的城市、州及相关地点信息。</p>
</div>
