<h1>美国电话区号查询</h1>
<p class="subtitle">输入 3 位电话区号，快速查询所在地区。</p>
<div class="tool-form">
  <div class="field">
    <label for="areaCode">电话区号</label
    ><input
      id="areaCode"
      inputmode="numeric"
      maxlength="3"
      placeholder="例如 212"
    />
  </div>
  <button class="btn" id="calculate">查询电话区号</button>
</div>
<div aria-live="polite" class="result" id="result">
  <strong>—</strong><span>请输入 3 位区号</span>
</div>
<div class="note">
  区号只表示号码规划区域，不能据此确定来电者实际位置或身份。
</div>
<div class="info">
  <h2>什么是 Area Code？</h2>
  <p>
    美国电话号码前 3 位通常是 North American Numbering Plan 的 Area
    Code，例如纽约常见 212、718、646 等。
  </p>
</div>
