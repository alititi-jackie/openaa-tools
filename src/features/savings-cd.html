<h1>存款 / CD 收益计算器</h1>
<p class="subtitle">输入存款金额、APY 和期限，估算利息收益。</p>
<div class="tool-form">
  <div class="field">
    <label for="principal">存款本金 ($)</label
    ><input id="principal" min="0" type="number" value="10000" />
  </div>
  <div class="field">
    <label for="apy">APY (%)</label
    ><input id="apy" min="0" step="0.01" type="number" value="4.5" />
  </div>
  <div class="field">
    <label for="years">存款年数</label
    ><input id="years" min="0" step="0.5" type="number" value="1" />
  </div>
  <div class="field">
    <label for="freq">每年复利次数</label
    ><select id="freq">
      <option selected="" value="12">12 次</option>
      <option value="4">4 次</option>
      <option value="1">1 次</option>
    </select>
  </div>
  <button class="btn" id="calculate">计算收益</button>
</div>
<div aria-live="polite" class="result" id="result">
  <strong>—</strong><span>填写数据后计算</span>
</div>
<div class="note">
  实际 CD 收益以银行合同和 APY 为准；提前支取可能产生罚金。
</div>
<div class="info">
  <h2>APY 和利息</h2>
  <p>
    工具按输入的 APY 和复利频率估算最终余额。不同银行的计息方式和 CD
    条款可能不同。
  </p>
</div>
