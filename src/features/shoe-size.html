<h1>中国 ↔ 美国鞋码转换器</h1>
<p class="subtitle">中国/欧码与 US 鞋码快速参考。</p>
<div class="tool-form">
  <div class="field">
    <label for="value">鞋码</label
    ><input id="value" step="0.5" type="number" value="42" />
  </div>
  <div class="field">
    <label for="direction">方向</label
    ><select id="direction">
      <option value="cn-us">中国/欧码 → US</option>
      <option value="us-cn">US → 中国/欧码</option>
    </select>
  </div>
  <button class="btn" id="calculate">转换鞋码</button>
</div>
<div aria-live="polite" class="result" id="result">
  <strong>8.5</strong><span>参考鞋码</span>
</div>
<div class="note">
  鞋码并非全球统一标准。男鞋、女鞋、品牌和鞋型都会有差异，购买前请以品牌官方尺码表为准。
</div>
<div class="info">
  <h2>美国鞋码为什么容易买错？</h2>
  <p>
    中国电商常使用毫米或欧码，美国品牌常使用 US
    尺码，而且男鞋和女鞋的数字体系不同。
  </p>
</div>
