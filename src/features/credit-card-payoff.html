<h1>信用卡还款计算器</h1>
<p class="subtitle">估算信用卡多久还清，以及大约需要支付多少利息。</p>
<div class="tool-form">
  <div class="field">
    <label for="balance">信用卡余额 ($)</label
    ><input id="balance" min="0" type="number" value="5000" />
  </div>
  <div class="field">
    <label for="apr">APR 年利率 (%)</label
    ><input id="apr" min="0" step="0.01" type="number" value="24.99" />
  </div>
  <div class="field">
    <label for="payment">每月还款 ($)</label
    ><input id="payment" min="0" type="number" value="200" />
  </div>
  <button class="btn" id="calculate">计算还款时间</button>
</div>
<div aria-live="polite" class="result" id="result">
  <strong>—</strong><span>填写数据后计算</span>
</div>
<div class="note">
  实际信用卡利息可能因日均余额、付款日期、费用和新消费而不同。
</div>
<div class="info">
  <h2>怎么算？</h2>
  <p>按固定月供和月利率进行估算，不考虑新增消费、滞纳金和其他费用。</p>
</div>
<section class="source-panel">
  <div class="source-meta">计算规则复核：2026年9月10日</div>
  <h2>信用卡还款估算原理</h2>
  <p>
    工具把APR换算为月利率，并假设不再新增消费、利率不变且每月按时支付固定金额。实际信用卡可能按日计息，并受到复利方式、费用、账单周期和促销利率影响。
  </p>
  <p>
    如果每月付款不高于当月利息，余额可能长期无法还清；提高月供通常可以同时缩短时间和减少总利息。
  </p>
  <p class="official-source">
    官方来源：<a
      href="https://www.consumerfinance.gov/consumer-tools/credit-cards/"
      rel="noopener noreferrer"
      target="_blank"
      >CFPB信用卡消费者资源</a
    >
  </p>
</section>
