<h1>美国加班工资计算器</h1>
<p class="subtitle">快速计算正常工资、加班工资和本周税前收入。</p>
<div class="tool-form">
  <div class="field">
    <label for="rate">时薪 ($)</label
    ><input id="rate" min="0" step="0.01" type="number" value="20" />
  </div>
  <div class="field">
    <label for="hours">正常工时（小时）</label
    ><input id="hours" min="0" type="number" value="40" />
  </div>
  <div class="field">
    <label for="ot">加班小时数</label
    ><input id="ot" min="0" type="number" value="5" />
  </div>
  <button class="btn" id="calculate">计算加班工资</button>
</div>
<div aria-live="polite" class="result" id="result">
  <strong>—</strong><span>填写数据后计算</span>
</div>
<div class="note">
  按 1.5 倍时薪估算加班工资；实际加班规则应以雇佣合同及适用法律为准。
</div>
<div class="info">
  <h2>怎么算？</h2>
  <p>正常工资 = 时薪 × 正常工时；加班工资 = 时薪 × 1.5 × 加班小时数。</p>
</div>
