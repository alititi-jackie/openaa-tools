<h1>年龄计算器</h1>
<p class="subtitle">输入出生日期，计算截至今天的实际年龄。</p>
<div class="tool-form">
  <div class="field">
    <label for="birth">出生日期</label><input id="birth" type="date" />
  </div>
  <button class="btn" id="calculate">计算年龄</button>
</div>
<div aria-live="polite" class="result" id="result">
  <strong>—</strong><span>请选择出生日期</span>
</div>
<div class="info">
  <h2>年龄怎么算？</h2>
  <p>
    工具根据当前日期与出生日期的年份、月份和日期计算周岁，不会把尚未到来的生日提前计算。
  </p>
</div>
