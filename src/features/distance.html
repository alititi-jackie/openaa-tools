<h1>英里 ↔ 公里换算器</h1>
<p class="subtitle">Miles 与 KM 快速双向转换。</p>
<div class="tool-form">
  <div class="field">
    <label for="value">距离</label
    ><input id="value" min="0" step="0.01" type="number" value="1" />
  </div>
  <div class="field">
    <label for="direction">方向</label
    ><select id="direction">
      <option value="mi-km">Miles → KM</option>
      <option value="km-mi">KM → Miles</option>
    </select>
  </div>
  <button class="btn" id="calculate">转换</button>
</div>
<div aria-live="polite" class="result" id="result">
  <strong>1.61</strong><span>KM</span>
</div>
<div class="info">
  <h2>换算公式</h2>
  <p>1 mile = 1.609344 km。美国汽车仪表和道路距离通常使用 mile。</p>
</div>
