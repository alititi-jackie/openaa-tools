<h1>美国折扣计算器</h1>
<p class="subtitle">快速计算打折后的价格，以及到底省了多少钱。</p>
<div class="tool-form">
  <div class="field">
    <label for="price">原价 ($)</label
    ><input id="price" min="0" step="0.01" type="number" value="100" />
  </div>
  <div class="field">
    <label for="discount">折扣 (%)</label
    ><input id="discount" max="100" min="0" type="number" value="20" />
  </div>
  <button class="btn" id="calculate">计算折扣</button>
</div>
<div aria-live="polite" class="result" id="result">
  <strong>$80.00</strong><span>折后价格 · 节省 $20.00</span>
</div>
<div class="info">
  <h2>折扣怎么算？</h2>
  <p>折后价格 = 原价 × (1 − 折扣率)。例如 $100 打 20% 折扣，折后为 $80。</p>
  <h2>常见问题</h2>
  <div class="faq">
    <h3>折扣后还要加 Sales Tax 吗？</h3>
    <p>
      很多美国购物场景中，销售税是在适用的应税价格基础上计算，具体以当地规则和商品类别为准。
    </p>
  </div>
</div>
