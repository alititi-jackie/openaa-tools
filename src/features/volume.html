<h1>加仑 ↔ 升换算器</h1>
<p class="subtitle">Gallon、Liter、Quart 快速换算。</p>
<div class="tool-form">
  <div class="field">
    <label for="value">容量</label
    ><input id="value" min="0" step="0.01" type="number" value="1" />
  </div>
  <div class="field">
    <label for="direction">方向</label
    ><select id="direction">
      <option value="gl">Gallon → Liter</option>
      <option value="lg">Liter → Gallon</option>
      <option value="ql">Quart → Liter</option>
      <option value="lq">Liter → Quart</option>
    </select>
  </div>
  <button class="btn" id="calculate">转换</button>
</div>
<div aria-live="polite" class="result" id="result">
  <strong>3.79</strong><span>Liter</span>
</div>
<div class="info">
  <h2>常用换算</h2>
  <p>1 US gallon ≈ 3.78541 liters；1 US quart ≈ 0.94635 liters。</p>
</div>
