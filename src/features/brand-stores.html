<div class="app-shell">
  <section class="content-wrap">
    <div class="nyc-wrap">
      <div class="nyc-head">
        <h1>纽约品牌门店地址大全</h1>
        <p>纽约及周边 Apple 苹果官方零售店、Samsung 三星体验店地址；可搜索、复制或直接导航。</p>
      </div>
      <input autocomplete="off" class="nyc-search" id="storeSearch" placeholder="搜索品牌、中文名称、英文名称或地址" type="search" />
      <div aria-label="品牌筛选" class="nyc-tabs" id="storeTabs" role="tablist">
        <button class="nyc-tab active" data-brand="all" type="button">全部品牌</button>
        <button class="nyc-tab" data-brand="apple" type="button">Apple 苹果</button>
        <button class="nyc-tab" data-brand="samsung" type="button">Samsung 三星</button>
      </div>
      <div class="nyc-count" id="storeCount" aria-live="polite"></div>
      <div class="nyc-grid" id="storeList"></div>
      <p class="nyc-foot">地址供导航参考；营业时间、服务和门店状态请以品牌官网为准。</p>
    </div>
  </section>
</div>
