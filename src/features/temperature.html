<h1>华氏度 ↔ 摄氏度转换器</h1>
<p class="subtitle">美国天气、烹饪和生活中常用的 °F 与 °C 快速换算。</p>
<div class="tool-form">
  <div class="field">
    <label for="value">温度</label
    ><input id="value" step="0.01" type="number" value="32" />
  </div>
  <div class="field">
    <label for="direction">方向</label
    ><select id="direction">
      <option value="F-C">°F → °C</option>
      <option value="C-F">°C → °F</option>
    </select>
  </div>
  <button class="btn" id="calculate">转换</button>
</div>
<div aria-live="polite" class="result" id="result">
  <strong>0.00°</strong><span>换算结果</span>
</div>
<div class="info">
  <h2>换算公式</h2>
  <p>°C = (°F − 32) × 5 ÷ 9；°F = °C × 9 ÷ 5 + 32。</p>
  <h2>常见温度</h2>
  <p>32°F = 0°C；68°F ≈ 20°C；77°F = 25°C；98.6°F = 37°C。</p>
</div>
