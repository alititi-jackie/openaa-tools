<div class="app-shell">
  <div>
    <section class="content-wrap">
      <div class="nyc-wrap">
        <div class="nyc-head">
          <h1>纽约周边地址导航</h1>
          <p>景点 · 购物 · 品牌店 · 实用地点 · 中文说明</p>
        </div>
        <span id="shareBtn" hidden></span>
        <span id="installBtn" hidden></span>
        <div class="install-help" id="installHelp" hidden></div>
        <input
          autocomplete="off"
          class="nyc-search"
          id="searchInput"
          placeholder="搜索中文名称、景点、商场、品牌店或地址"
          type="search"
        />
        <div
          aria-label="地址分类"
          class="nyc-tabs"
          id="categoryTabs"
          role="tablist"
        >
          <button class="nyc-tab active" data-category="all" type="button">
            全部</button
          ><button class="nyc-tab" data-category="景点" type="button">
            景点</button
          ><button class="nyc-tab" data-category="购物" type="button">
            购物</button
          ><button class="nyc-tab" data-category="品牌店" type="button">
            品牌店</button
          ><button class="nyc-tab" data-category="实用" type="button">
            实用
          </button>
        </div>
        <div class="nyc-count" id="countText"></div>
        <div class="nyc-grid" id="placeList"></div>
        <section class="nyc-links">
          <h2>更多实用网站</h2>
          <div class="nyc-link-grid">
            <a
              class="nyc-site-link"
              href="https://openaa.com"
              rel="noopener noreferrer"
              target="_blank"
              ><strong>OpenAA</strong
              ><span>纽约华人生活、招聘、二手与服务</span></a
            ><a
              class="nyc-site-link"
              href="https://dmv.openaa.com"
              rel="noopener noreferrer"
              target="_blank"
              ><strong>OpenAA DMV</strong
              ><span>美国 DMV 中文题库与模拟考试</span></a
            ><a
              class="nyc-site-link"
              href="https://tools.openaa.com"
              rel="noopener noreferrer"
              target="_blank"
              ><strong>OpenAA 工具库</strong
              ><span>在美华人常用生活工具</span></a
            ><a
              class="nyc-site-link"
              href="https://numbermobi.com"
              rel="noopener noreferrer"
              target="_blank"
              ><strong>NumberMobi</strong><span>美国手机靓号</span></a
            >
          </div>
        </section>
        <p class="nyc-foot">tools.openaa.com · OpenAA 旗下实用工具库</p>
      </div>
    </section>
  </div>
</div>
