<h1>美国汽车加油成本计算器</h1>
<p class="subtitle">根据行驶里程、车辆 MPG 和汽油价格估算油费。</p>
<div class="tool-form">
  <div class="field">
    <label for="miles">行驶里程 (miles)</label
    ><input id="miles" min="0" step="0.1" type="number" value="100" />
  </div>
  <div class="field">
    <label for="mpg">车辆 MPG</label
    ><input id="mpg" min="0.01" step="0.1" type="number" value="25" />
  </div>
  <div class="field">
    <label for="price">汽油价格 ($/gallon)</label
    ><input id="price" min="0" step="0.01" type="number" value="3.50" />
  </div>
  <button class="btn" id="calculate">计算油费</button>
</div>
<div aria-live="polite" class="result" id="result">
  <strong>$14.00</strong><span>预计油费 · 约 4.00 gallon</span>
</div>
<div class="info">
  <h2>计算方法</h2>
  <p>预计用油量 = 行驶里程 ÷ MPG；预计油费 = 用油量 × 每加仑价格。</p>
</div>
