<h1>MPG ↔ L/100km 油耗换算器</h1>
<p class="subtitle">美国车辆常见 MPG 与国内常见 L/100km 快速换算。</p>
<div class="tool-form">
  <div class="field">
    <label for="value">数值</label
    ><input id="value" min="0.000001" step="0.01" type="number" value="25" />
  </div>
  <div class="field">
    <label for="direction">方向</label
    ><select id="direction">
      <option value="mpg-l">MPG → L/100km</option>
      <option value="l-mpg">L/100km → MPG</option>
    </select>
  </div>
  <button class="btn" id="calculate">转换</button>
</div>
<div aria-live="polite" class="result" id="result">
  <strong>9.41</strong><span>L/100km</span>
</div>
<div class="info">
  <h2>换算公式</h2>
  <p>L/100km = 235.214583 ÷ MPG；MPG = 235.214583 ÷ L/100km。</p>
</div>
