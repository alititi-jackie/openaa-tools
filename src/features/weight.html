<h1>磅 ↔ 公斤重量换算器</h1>
<p class="subtitle">美国常用 lb、oz 与 kg、g 快速换算。</p>
<div class="tool-form">
  <div class="field">
    <label for="value">数值</label
    ><input id="value" min="0" step="0.01" type="number" value="1" />
  </div>
  <div class="field">
    <label for="direction">方向</label
    ><select id="direction">
      <option value="lbkg">lb → kg</option>
      <option value="kglb">kg → lb</option>
      <option value="ozg">oz → g</option>
      <option value="gzo">g → oz</option>
    </select>
  </div>
  <button class="btn" id="calculate">转换</button>
</div>
<div aria-live="polite" class="result" id="result">
  <strong>0.45</strong><span>kg</span>
</div>
<div class="info">
  <h2>常用换算</h2>
  <p>1 lb ≈ 0.453592 kg；1 oz ≈ 28.3495 g。实际商品重量以包装标示为准。</p>
</div>
