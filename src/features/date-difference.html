<h1>日期差计算器</h1>
<p class="subtitle">快速计算两个日期之间相差多少天。</p>
<div class="tool-form">
  <div class="field">
    <label for="start">开始日期</label><input id="start" type="date" />
  </div>
  <div class="field">
    <label for="end">结束日期</label><input id="end" type="date" />
  </div>
  <button class="btn" id="calculate">计算日期差</button>
</div>
<div aria-live="polite" class="result" id="result">
  <strong>—</strong><span>请选择两个日期</span>
</div>
<div class="info">
  <h2>怎么算？</h2>
  <p>工具按日历日期计算两个日期的绝对天数差，不区分先后顺序。</p>
</div>
