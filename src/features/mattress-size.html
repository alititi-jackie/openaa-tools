<h1>美国床垫尺寸对照表</h1>
<p class="subtitle">快速查看 Twin、Full、Queen、King 等美国床垫标准尺寸。</p>
<div class="tool-form">
  <div class="field">
    <label for="size">床垫类型</label
    ><select id="size">
      <option>Twin</option>
      <option>TwinXL</option>
      <option>Full</option>
      <option selected="">Queen</option>
      <option>King</option>
      <option>CalKing</option>
    </select>
  </div>
  <button class="btn" id="calculate">查看尺寸</button>
</div>
<div aria-live="polite" class="result" id="result">
  <strong>60 × 80 in</strong><span>152.4 × 203.2 cm</span>
</div>
<div class="info">
  <h2>美国常见床垫尺寸</h2>
  <p>
    Twin 适合单人；Full/Double 比 Twin 宽；Queen 是美国非常常见的双人尺寸；King
    更宽；California King 更长。
  </p>
</div>
