<h1>平方英尺 ↔ 平方米换算器</h1>
<p class="subtitle">sq ft、㎡、acre 快速换算，美国房产常用。</p>
<div class="tool-form">
  <div class="field">
    <label for="value">面积</label
    ><input id="value" min="0" step="0.01" type="number" value="1000" />
  </div>
  <div class="field">
    <label for="direction">方向</label
    ><select id="direction">
      <option value="ftm">sq ft → ㎡</option>
      <option value="mft">㎡ → sq ft</option>
      <option value="acrem">acre → ㎡</option>
      <option value="macre">㎡ → acre</option>
    </select>
  </div>
  <button class="btn" id="calculate">转换</button>
</div>
<div aria-live="polite" class="result" id="result">
  <strong>92.90</strong><span>㎡</span>
</div>
<div class="info">
  <h2>常用换算</h2>
  <p>
    1 sq ft = 0.09290304 ㎡；1 acre ≈ 4046.8564 ㎡。美国房产广告常使用平方英尺。
  </p>
</div>
