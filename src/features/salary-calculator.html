<h1>美国税前工资计算器</h1>
<p class="subtitle">年薪、月薪、周薪快速换算，结果为税前估算。</p>
<div class="tool-form">
  <div class="field">
    <label for="annual">年薪 ($)</label
    ><input id="annual" min="0" step="0.01" type="number" value="60000" />
  </div>
  <button class="btn" id="calculate">计算工资</button>
</div>
<div aria-live="polite" class="result" id="result">
  <strong>$5,000.00</strong><span>月薪税前 · 周薪约 $1,153.85</span>
</div>
<div class="info">
  <h2>怎么计算？</h2>
  <p>
    年薪除以 12 得到平均月薪，除以 52
    得到平均周薪。这里不扣除联邦税、州税、Social Security、Medicare 或福利。
  </p>
  <h2>常见问题</h2>
  <div class="faq">
    <h3>这个结果是到手工资吗？</h3>
    <p>
      不是，这是税前收入估算。实际到手工资取决于税务身份、州、扣除项目和福利。
    </p>
  </div>
</div>
