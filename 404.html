<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0066FF">
  
  <title>404 - 页面未找到 | OpenAA 工具库</title>
  <meta name="description" content="抱歉，您访问的页面不存在。返回 OpenAA 工具库首页。">
  
  <link rel="stylesheet" href="/src/styles/brand.css">
  <link rel="stylesheet" href="/src/styles/layout.css">
  <link rel="icon" href="/favicon.ico">
  
  <style>
    .error-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
      background: linear-gradient(135deg, #F8F9FB 0%, #E8F0FF 100%);
    }
    
    .error-code {
      font-size: 8rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 1rem;
    }
    
    .error-title {
      font-size: 2rem;
      font-weight: 700;
      color: var(--color-text-primary);
      margin-bottom: 1rem;
    }
    
    .error-message {
      font-size: 1.1rem;
      color: var(--color-text-secondary);
      max-width: 500px;
      margin-bottom: 2rem;
    }
    
    .error-illustration {
      font-size: 6rem;
      margin-bottom: 2rem;
      animation: float 3s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }
    
    .action-buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <header class="openaa-header">
    <div class="container">
      <a href="/" class="openaa-logo">
        <div class="logo-icon">A</div>
        <div class="logo-text">
          <div class="logo-brand">OpenAA</div>
          <div class="logo-sub">工具库</div>
        </div>
      </a>
      
      <nav class="openaa-nav">
        <a href="/">首页</a>
        <a href="/tools/">全部工具</a>
        <a href="https://www.openaa.com/" target="_blank">关于 OpenAA</a>
      </nav>
      
      <button class="mobile-menu-btn">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <div class="error-container">
    <div class="error-illustration">🤔</div>
    <div class="error-code">404</div>
    <h1 class="error-title">页面未找到</h1>
    <p class="error-message">
      抱歉，您访问的页面不存在或已被移除。请检查 URL 是否正确，或使用下方按钮返回。
    </p>
    
    <div class="action-buttons">
      <a href="/" class="btn btn-primary btn-lg">返回首页</a>
      <a href="/tools/" class="btn btn-secondary btn-lg">浏览工具</a>
    </div>
  </div>

  <footer class="openaa-footer" style="margin-top: 4rem;">
    <div class="container">
      <div class="footer-links">
        <a href="/">首页</a>
        <a href="/tools/">全部工具</a>
        <a href="https://github.com/alititi-jackie/openaa-tools" target="_blank">GitHub</a>
      </div>
      
      <div class="footer-bottom">
        <p>&copy; 2025 OpenAA 工具库。保留所有权利。</p>
      </div>
    </div>
  </footer>

  <script src="/src/js/app.js"></script>
</body>
</html>
